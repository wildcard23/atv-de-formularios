{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#183b34">
    <title>{% block title %}Acervo{% endblock %} | Entrelinhas</title>
    <link rel="stylesheet" href="{% static 'catalog/styles.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="wordmark" href="{% url 'book_list' %}" aria-label="Entrelinhas, página inicial">
                <span class="wordmark-symbol" aria-hidden="true">E</span>
                <span>entrelinhas<span class="wordmark-period">.</span></span>
            </a>
            <nav class="site-nav" aria-label="Navegação principal">
                <a class="nav-link" href="{% url 'book_list' %}">Acervo</a>
                <div class="nav-actions">
                    <a class="nav-action" href="{% url 'book_create' %}"><span aria-hidden="true">+</span> Novo livro</a>
                    <a class="nav-action" href="{% url 'author_create' %}"><span aria-hidden="true">+</span> Novo autor</a>
                </div>
            </nav>
        </div>
    </header>
    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <span>ENTRELINHAS · UM ACERVO EM CONSTRUÇÃO</span>
        <span>Feito para quem lê.</span>
    </footer>
</body>
</html>
